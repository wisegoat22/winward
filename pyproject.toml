[project]
name = "jev-local"
version = "0.1.0"
description = "A local, no-generation decision engine for Apple silicon"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx-lm==0.31.3",
  "fastapi==0.142.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
